<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FAF7F2">
<title>钱来 · Buy or Bye</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23F2B33D'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23C98A12' stroke-width='3'/%3E%3Cpath d='M22 20l10 13 10-13M21 34h22M21 42h22M32 33v16' fill='none' stroke='%237A5200' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FAF7F2;--card:#fff;--ink:#16130F;--ink2:#6F685E;--ink3:#A8A196;--line:#ECE6DC;--soft:#F3EEE6;
  --gold:#F2B33D;--gold2:#FCE9BC;--gold-ink:#8A5A00;--good:#2F9E6E;--bad:#D9534F;
  --r:28px;--shadow:0 22px 60px -22px rgba(70,45,10,.28),0 2px 6px rgba(70,45,10,.05);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI",Roboto,"Noto Sans SC","Microsoft YaHei",sans-serif;
  --round:ui-rounded,"SF Pro Rounded","Nunito",var(--sans);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --top:calc(58px + var(--sat));--tabh:calc(84px + var(--sab));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}

/* ---------- top bar ---------- */
#topbar{position:absolute;z-index:20;top:0;left:0;right:0;height:var(--top);padding:var(--sat) 18px 0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
#topbar>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:9px}
.brand .bz{font:900 25px/1 var(--serif);letter-spacing:.04em}
.brand .be{font:italic 500 14px/1 Georgia,"Times New Roman",serif;color:var(--ink2);letter-spacing:.01em}
.tr{display:flex;align-items:center;gap:10px}
.pill{height:38px;padding:0 14px 0 9px;border-radius:99px;background:#fff;box-shadow:0 1px 0 var(--line),0 6px 18px -10px rgba(70,45,10,.35);display:flex;align-items:center;gap:7px;font:700 15px var(--round);font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE08A,#F2B33D 60%,#D9952A);box-shadow:inset 0 0 0 2px rgba(138,90,0,.28);display:inline-block;flex:none;position:relative}
.coin::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px solid rgba(138,90,0,.45)}
.me{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 1px 0 var(--line),0 6px 18px -10px rgba(70,45,10,.35);display:grid;place-items:center;overflow:hidden}
.me canvas,.px{image-rendering:pixelated;image-rendering:crisp-edges}
.me canvas{width:26px;height:29px;margin-top:6px}
.pill.bump{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.12)}}

/* ---------- pages ---------- */
.page{position:absolute;inset:0;display:none}
#app[data-page=swipe] #pg-swipe,#app[data-page=post] #pg-post,#app[data-page=room] #pg-room{display:flex}

/* ---------- swipe ---------- */
#pg-swipe{flex-direction:column;align-items:center;padding:calc(var(--top) + 6px) 18px calc(var(--tabh) + 8px)}
.deck{position:relative;flex:1;min-height:0;width:100%;max-width:430px;perspective:1600px}
.card{position:absolute;inset:0;border-radius:var(--r);transform-origin:50% 100%;touch-action:none;user-select:none;-webkit-user-select:none}
.card.next{transform:scale(.94) translateY(16px);opacity:.55;pointer-events:none;transition:transform .35s,opacity .35s}
.card.enter{animation:cardin .42s cubic-bezier(.2,.8,.2,1)}
@keyframes cardin{from{transform:scale(.94) translateY(16px);opacity:.55}}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.3,.75,.2,1)}
.card.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg);padding:26px 26px 22px;justify-content:center}
.pic{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}
.pic img{max-width:72%;max-height:78%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 14px 14px rgba(60,40,10,.14))}
.pic.photo img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;filter:none}
.pic.framed img{max-width:62%;max-height:76%;border:9px solid #fff;outline:4px solid #2B2520;outline-offset:0;box-shadow:0 18px 30px -12px rgba(40,25,5,.45);filter:none;background:#fff}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.18)}.dots i.on{background:rgba(0,0,0,.6)}
.meta{padding:16px 22px 20px;flex:none}
.chips{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.chip{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-weight:600;color:var(--ink);flex:none}
.chip.used{background:var(--soft);border-color:transparent}
.chip.gold{background:var(--gold2);border-color:transparent;color:var(--gold-ink)}
.title{font-size:22px;font-weight:700;margin:9px 0 3px;letter-spacing:-.01em;line-height:1.25;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.desc{font-size:14px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:0}
.price{font:800 clamp(42px,8.4vh,66px)/1 var(--sans);letter-spacing:-.04em;margin-top:12px;font-variant-numeric:tabular-nums;display:flex;align-items:flex-start;gap:3px}
.price .cur{font-size:.46em;font-weight:700;letter-spacing:0;margin-top:.16em;color:var(--ink2)}
.more{position:absolute;right:14px;bottom:12px;height:30px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);font-size:12.5px;font-weight:600;color:var(--ink2)}
.stamp{position:absolute;top:24px;font:italic 700 34px/1 Georgia,serif;padding:8px 18px;border:3px solid;border-radius:14px;opacity:0;pointer-events:none;background:rgba(255,255,255,.9);z-index:3}
.stamp.s-buy{left:20px;transform:rotate(-12deg);color:var(--gold-ink);border-color:var(--gold)}
.stamp.s-bye{right:20px;transform:rotate(12deg);color:var(--ink2);border-color:var(--ink3)}
.actions{display:flex;gap:12px;width:100%;max-width:430px;margin-top:14px;height:64px;flex:none;position:relative}
.btn{flex:1;height:64px;border-radius:22px;font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn em{font:italic 500 15px Georgia,serif;opacity:.55}
html[lang=en] .btn em{display:none}
.btn.bye{border:1.5px solid #D8D0C3;background:#fff}
.btn.buy{background:var(--ink);color:#fff}
.btn.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.cont{display:none;flex:1;gap:12px;align-items:stretch}
.revealing .actions .btn{display:none}.revealing .cont{display:flex}
.undo{flex:none;padding:0 20px;border-radius:22px;border:1.5px solid #D8D0C3;background:#fff;font-weight:600;color:var(--ink2);font-size:16px}
.nextb{flex:1;border-radius:22px;background:var(--soft);font-weight:700;font-size:18px;position:relative;overflow:hidden}
.nextb i{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--gold);transform-origin:0 50%}
.nextb.run i{animation:cd linear forwards}.nextb.paused i{animation-play-state:paused}
@keyframes cd{to{transform:scaleX(0)}}
.keys{display:none;margin-top:10px;font-size:12px;color:var(--ink3)}
.keys kbd{font:600 11px var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:#fff;color:var(--ink2)}
@media (hover:hover) and (min-width:760px){.keys{display:block}}

/* reveal (card back) */
.rv-k{font-size:15px;color:var(--ink2);text-align:center}
.rv-big{font:800 clamp(30px,6vh,44px)/1.1 var(--sans);letter-spacing:-.03em;text-align:center;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.rv-big b{color:var(--gold-ink)}
.rv-sub{font-size:14px;color:var(--ink2);text-align:center;line-height:1.5}
.bar{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;margin:22px 0 8px;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F7C95B,#F2B33D);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1) .35s}
.bar.done i{background:linear-gradient(90deg,#57C08F,#2F9E6E)}
.rv-pct{display:flex;justify-content:space-between;font:700 13px var(--round);color:var(--ink2)}
.rows{margin-top:18px;border-top:1px solid var(--line)}
.rows>div{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--ink2)}
.rows b{font:700 18px var(--round);color:var(--ink);font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:var(--good);color:#fff;font-weight:700;font-size:12px;border-radius:99px;padding:3px 10px;margin-left:6px;vertical-align:middle}
.wtp{margin-top:18px;background:var(--soft);border-radius:18px;padding:14px}
.wtp label{display:block;font-weight:700;font-size:15px;margin-bottom:9px}
.wtp .row{display:flex;gap:8px}
.wtp .inp{flex:1;display:flex;align-items:center;background:#fff;border-radius:12px;padding:0 12px;height:44px;font:700 18px var(--round);min-width:0}
.wtp .inp span{color:var(--ink3);margin-right:4px}
.wtp input{border:0;outline:0;background:none;width:100%;min-width:0;font:inherit}
.wtp button{height:44px;padding:0 14px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.wtp .ok{font-size:14px;color:var(--good);font-weight:700}
.rv-art{width:110px;height:110px;object-fit:contain;display:block;margin:0 auto 10px;filter:drop-shadow(0 8px 10px rgba(60,40,10,.18))}

/* empty */
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:10px}
.empty h3{font:900 26px var(--serif)}
.empty p{color:var(--ink2);font-size:15px;line-height:1.6;max-width:300px}
.empty .col{display:flex;flex-direction:column;gap:10px;margin-top:14px;width:100%;max-width:280px}
.b1{height:52px;border-radius:18px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.b2{height:52px;border-radius:18px;border:1.5px solid #D8D0C3;background:#fff;font-weight:700;font-size:16px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.b1:disabled{opacity:.3}.b1.sm,.b2.sm{height:42px;font-size:14px;border-radius:14px;padding:0 16px}
.b3{color:var(--ink2);font-weight:600;font-size:14px;padding:10px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ink3)}
.danger{color:var(--bad)}

/* ---------- tab bar ---------- */
#tabbar{position:absolute;z-index:30;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);height:62px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--line),0 18px 40px -16px rgba(70,45,10,.4);display:flex;align-items:center;gap:6px}
.tab{width:84px;height:48px;border-radius:99px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink3);font-size:11px;font-weight:700;transition:color .2s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab.plus{width:52px;height:52px;background:var(--ink);color:#fff;border-radius:50%;margin:0 4px}
.tab.plus svg{width:24px;height:24px;stroke-width:2.6}
.tab.plus.on{background:var(--gold);color:var(--ink)}
.tab.pop{animation:pop .5s}
@keyframes pop{35%{transform:scale(1.28)}}

/* ---------- sheets ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(22,19,15,0);transition:background .28s}
.sheet-wrap.open{background:rgba(22,19,15,.38)}
.sheet{width:100%;max-width:520px;max-height:90dvh;background:var(--bg);border-radius:28px 28px 0 0;transform:translateY(102%);transition:transform .36s cubic-bezier(.2,.85,.2,1);display:flex;flex-direction:column;overflow:hidden}
.sheet-wrap.open .sheet{transform:none}
.sheet-h{flex:none;display:flex;align-items:center;justify-content:space-between;padding:18px 22px 6px}
.sheet-h h3{font:900 22px var(--serif)}
.x{width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:18px;line-height:1;color:var(--ink2)}
.sheet-b{overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 22px calc(26px + var(--sab));overscroll-behavior:contain}
.sheet.full{max-height:100dvh;height:100dvh;border-radius:0;max-width:none}
.sheet.full .sheet-b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:calc(20px + var(--sat))}
@media (min-width:720px){
  .sheet-wrap{align-items:center}
  .sheet{border-radius:28px;max-height:86dvh;transform:translateY(30px) scale(.97);opacity:0;transition:transform .3s,opacity .3s}
  .sheet-wrap.open .sheet{opacity:1}
  .sheet.full{border-radius:0;transform:none}
}
.sec{margin-top:22px}
.sec>h4{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:10px;letter-spacing:.02em}
.note{font-size:12.5px;line-height:1.6;color:var(--ink2);background:var(--soft);border-radius:14px;padding:11px 14px;margin-top:14px}
.note.gold{background:var(--gold2);color:var(--gold-ink)}
.list{background:#fff;border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:15px}
.li:last-child{border-bottom:0}
.li .g{flex:1;min-width:0}
.li .g small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font:700 15px var(--round);font-variant-numeric:tabular-nums;white-space:nowrap}
.li .v.plus{color:var(--good)}
.li select{border:0;background:none;font-weight:600;text-align:right;outline:0;max-width:170px}
.thumb{width:46px;height:46px;border-radius:12px;background:var(--soft);flex:none;display:grid;place-items:center;overflow:hidden}
.thumb img{max-width:82%;max-height:82%;object-fit:contain}.thumb.photo img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
.bigbal{font:800 46px/1 var(--round);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.kv{display:flex;gap:10px;margin-top:14px}
.kv>div{flex:1;background:#fff;border-radius:16px;padding:12px 14px}
.kv small{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.kv b{font:700 17px var(--round);font-variant-numeric:tabular-nums}

/* forms */
.fld{margin-top:20px}
.fld>label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.in{width:100%;height:52px;border-radius:16px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font-size:16px;outline:0;transition:border-color .15s}
textarea.in{height:96px;padding:13px 16px;resize:none;line-height:1.5}
.in:focus{border-color:var(--ink)}
.money{display:flex;align-items:center;height:64px;border-radius:18px;border:1.5px solid var(--line);background:#fff;padding:0 16px;transition:border-color .15s}
.money:focus-within{border-color:var(--ink)}
.money span{font:700 22px var(--round);color:var(--ink3);margin-right:6px}
.money input{flex:1;min-width:0;border:0;outline:0;background:none;font:800 30px var(--round);letter-spacing:-.02em}
.money.sm{height:52px}.money.sm input{font-size:20px}.money.sm span{font-size:17px}
.hint{font-size:12.5px;color:var(--ink2);margin-top:7px;line-height:1.5}
.segc{display:flex;background:var(--soft);border-radius:16px;padding:4px;gap:4px}
.segc button{flex:1;height:42px;border-radius:12px;font-weight:700;font-size:15px;color:var(--ink2)}
.segc button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -3px rgba(70,45,10,.3)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{height:42px;padding:0 15px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14.5px}
.cats button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chk{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:14px;color:var(--ink2)}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.quick button{height:38px;padding:0 13px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font:700 14px var(--round)}

/* ---------- post page ---------- */
#pg-post{overflow:auto;-webkit-overflow-scrolling:touch;justify-content:center;padding:calc(var(--top) + 4px) 20px calc(var(--tabh) + 30px)}
.post-wrap{width:100%;max-width:520px;height:max-content;padding-bottom:30px}
.post-wrap.wide{max-width:960px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:48px;align-items:start}
.pv{display:none}
.post-wrap.wide .pv{display:block;position:sticky;top:10px}
.pv h4{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:10px}
.pv .card{position:relative;height:540px;inset:auto}
.ph-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.ph{width:104px;height:104px;border-radius:18px;flex:none;position:relative;overflow:hidden;background:var(--soft)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .del{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1}
.ph.add{border:1.5px dashed #CFC6B8;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.ph.add b{font-size:26px;font-weight:300;line-height:1;color:var(--ink)}
.stk{display:flex;gap:14px;align-items:center;background:#fff;border-radius:18px;padding:12px}
.stk .box{width:92px;height:92px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#F7E6D2,#F1DCC4)}
.stk .box img{max-width:84%;max-height:84%;object-fit:contain}
.stk .box.busy{position:relative;overflow:hidden}.stk .box.busy img{opacity:.55;filter:blur(1px)}.stk .box.busy::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:250% 100%;animation:stkscan 1.3s linear infinite}
@keyframes stkscan{from{background-position:130% 0}to{background-position:-30% 0}}
.stk .segc{flex:1}
.pubbar{margin-top:26px;display:flex;gap:10px}
.pubbar .b1{flex:1;height:58px;font-size:18px;border-radius:20px}
.mine-li{display:flex;gap:14px;align-items:center;background:#fff;border-radius:20px;padding:12px;margin-top:10px;width:100%;text-align:left}
.mine-li .thumb{width:64px;height:64px;border-radius:14px}
.mine-li h5{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mine-li p{font-size:12.5px;color:var(--ink2);margin-top:3px}
.mine-li .v{font:800 17px var(--round)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--soft);color:var(--ink2);margin-left:6px;vertical-align:2px}
.tag.ok{background:#DDF3E8;color:var(--good)}

/* dashboard */
.big3{display:flex;gap:10px;margin-top:6px}
.big3>div{flex:1;background:#fff;border-radius:18px;padding:14px 12px;text-align:center}
.big3 b{display:block;font:800 26px var(--round);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big3 small{font-size:12px;color:var(--ink2)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;background:#fff;border-radius:18px;padding:14px 12px 8px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars i{display:block;width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:var(--gold);min-height:3px;transition:height .5s}
.bars b{font:700 12px var(--round)}
.bars small{font-size:10px;color:var(--ink2);white-space:nowrap}
.tbl{background:#fff;border-radius:18px;overflow:hidden;font-size:14px}
.tbl>div{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--line)}
.tbl>div:last-child{border:0}
.tbl>div.cur{background:var(--gold2);font-weight:700}
.tbl b{font:700 14px var(--round)}

/* ---------- room ---------- */
#pg-room{background:linear-gradient(180deg,#FBEFDD,#F6DFC6)}
#room-cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:0}
.hud-top{position:absolute;z-index:5;top:calc(var(--top) + 2px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.hud-top>*{pointer-events:auto}
.owner{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;padding:8px 14px 8px 8px;box-shadow:0 8px 24px -14px rgba(70,45,10,.5)}
.owner canvas{width:34px;height:38px;background:var(--gold2);border-radius:12px;padding:3px 3px 0}
.owner b{display:block;font:800 15px var(--round)}
.owner small{font:600 12px var(--round);color:var(--ink2)}
.hud-btns{display:flex;gap:8px}
.hbtn{height:40px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font:700 14px var(--round);box-shadow:0 8px 24px -14px rgba(70,45,10,.5)}
.hbtn.dark{background:var(--ink);color:#fff}
.tray-btn{position:absolute;z-index:5;left:16px;bottom:calc(var(--tabh) + 6px);height:44px;padding:0 16px;border-radius:99px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font:700 14px var(--round);box-shadow:0 8px 24px -14px rgba(70,45,10,.5);display:flex;gap:8px;align-items:center}
.tray-btn b{background:var(--ink);color:#fff;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
.bubble{position:absolute;z-index:5;left:50%;bottom:calc(var(--tabh) + 62px);transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:16px;white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none;max-width:90vw}
.bubble.on{opacity:.92}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cell{background:#fff;border-radius:18px;padding:10px 8px 10px;text-align:center;min-width:0}
.cell .im{height:76px;display:grid;place-items:center;border-radius:12px;overflow:hidden}
.cell .im img{max-width:86%;max-height:86%;object-fit:contain}.cell .im.photo img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
.cell h6{font-size:12.5px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell small{font:600 12px var(--round);color:var(--ink2)}
.hero{height:210px;border-radius:22px;display:grid;place-items:center;overflow:hidden;position:relative}
.hero img{max-width:62%;max-height:80%;object-fit:contain;filter:drop-shadow(0 12px 12px rgba(60,40,10,.16))}
.hero.photo img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;filter:none}
.hero.framed img{max-height:78%;border:8px solid #fff;outline:3px solid #2B2520;filter:none;box-shadow:0 14px 24px -10px rgba(40,25,5,.45)}
.d-title{font-size:22px;font-weight:800;margin-top:16px;letter-spacing:-.01em}
.d-price{font:800 34px var(--round);letter-spacing:-.03em;margin-top:4px}
.d-desc{font-size:15px;line-height:1.7;color:var(--ink2);margin-top:10px;white-space:pre-wrap}
.btnrow{display:flex;gap:10px;margin-top:18px}.btnrow>*{flex:1}
.themes{display:flex;gap:12px}
.themes button{flex:1;border-radius:20px;padding:10px;background:#fff;border:2px solid transparent;font-weight:700;font-size:13.5px}
.themes button.on{border-color:var(--ink)}
.themes i{display:block;height:64px;border-radius:14px;margin-bottom:8px}

/* character picker */
.chars{display:flex;gap:14px;justify-content:center;margin-top:8px}
.chars button{width:128px;border-radius:24px;background:#fff;padding:14px 10px 12px;border:2.5px solid transparent;font-weight:700}
.chars button.on{border-color:var(--ink)}
.chars canvas{width:80px;height:90px;display:block;margin:0 auto 8px}
.sw{display:flex;gap:10px;justify-content:center;margin-top:8px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw button.on{box-shadow:0 0 0 2.5px var(--ink)}
.ob{width:100%;max-width:400px;text-align:center}
.ob h2{font:900 28px/1.3 var(--serif);margin-bottom:10px}
.ob p{color:var(--ink2);font-size:14.5px;line-height:1.65}
.ob .fld{text-align:left}
.ob .b1{width:100%;margin-top:24px;height:58px;font-size:18px;border-radius:20px}
.ob .steps{display:flex;gap:6px;justify-content:center;margin-bottom:26px}
.ob .steps i{width:22px;height:4px;border-radius:9px;background:var(--line)}.ob .steps i.on{background:var(--ink)}
.swl{font-size:12px;font-weight:700;color:var(--ink2);margin-top:16px}

/* ---------- fx ---------- */
#toast{position:absolute;z-index:90;left:50%;top:calc(var(--top) + 8px);transform:translate(-50%,-20px);background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:11px 18px;border-radius:16px;opacity:0;transition:all .3s;pointer-events:none;max-width:min(88vw,420px);text-align:center;line-height:1.45}
#toast.on{opacity:.96;transform:translate(-50%,0)}
#fx{position:absolute;inset:0;z-index:80;pointer-events:none;overflow:hidden}
.fly{position:absolute;object-fit:contain;will-change:transform}
.payday{position:absolute;inset:0;z-index:70;background:rgba(250,247,242,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.payday h2{font:900 44px var(--serif);letter-spacing:.08em}
.payday .amt{font:800 58px var(--round);letter-spacing:-.03em;color:var(--gold-ink);margin:10px 0 6px;font-variant-numeric:tabular-nums}
.payday p{color:var(--ink2);font-size:15px}
.payday .b1{margin-top:30px;min-width:200px;height:58px;font-size:18px;border-radius:20px;position:relative;z-index:2}
.rain{position:absolute;top:-40px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE08A,#F2B33D 60%,#D9952A);box-shadow:inset 0 0 0 2.5px rgba(138,90,0,.28);animation:rain linear forwards}
@keyframes rain{to{transform:translateY(115vh) rotate(540deg)}}
.conf{position:absolute;width:9px;height:14px;border-radius:2px;animation:conf 1.1s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
[hidden]{display:none!important}
.is-empty .actions,.is-empty .keys{visibility:hidden}
.busy .actions .btn{opacity:.55;pointer-events:none}
.cmts{margin-top:24px}
.cm-h{font-size:15px;font-weight:800;margin-bottom:12px}.cm-h .cm-n{color:var(--ink3);font-weight:700;margin-left:2px}
.cm-f{display:flex;gap:8px;align-items:flex-end}
.cm-f textarea{flex:1;min-width:0;min-height:44px;max-height:120px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:11px 14px;font-size:15px;line-height:1.45;resize:none;outline:0}
.cm-f textarea:focus{border-color:var(--ink)}
.cm-f .b1{height:44px;flex:none}
.cm-hint{margin:6px 0 0}
.cm-list{margin-top:14px;background:#fff;border-radius:18px;padding:2px 14px}
.cm{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.cm:last-child{border-bottom:0}
.cm-av{width:30px;height:34px;flex:none;background:var(--gold2);border-radius:10px;padding:2px 2px 0}
.cm-b{flex:1;min-width:0}
.cm-top{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}
.cm-top b{font-weight:700;font-size:13.5px}
.cm-tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--soft);color:var(--ink2)}
.cm-tag.buy{background:var(--gold2);color:var(--gold-ink)}.cm-tag.seller{background:var(--ink);color:#fff}.cm-tag.wish{background:#E8F0FB;color:#3E6BB5}
.cm-time{color:var(--ink3);font-size:12px}
.cm-a{margin-left:auto;color:var(--ink3);font-size:12px;font-weight:600;padding:2px 4px}
.cm-b p{font-size:14.5px;line-height:1.55;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.cm-empty{color:var(--ink3);font-size:13.5px;text-align:center;padding:16px 0}
.cmts .cm-login{width:100%}
.share{background:#fff;border-radius:20px;padding:16px;text-align:center}
.share .code{font:800 34px var(--round);letter-spacing:.18em;margin:4px 0 10px}
.share .btnrow{margin-top:8px}
.codein{display:flex;gap:8px}.codein .in{flex:1;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
#app.night[data-page=room] .brand .bz{color:#fff}#app.night[data-page=room] .brand .be{color:rgba(255,255,255,.7)}
#app.night[data-page=room] .owner,#app.night[data-page=room] .hbtn:not(.dark),#app.night[data-page=room] .tray-btn{background:rgba(255,255,255,.94)}
.pic,.hero,.thumb,.cell .im,.stk .box{grid-template:minmax(0,1fr)/minmax(0,1fr)}
.pic img,.hero img,.thumb img,.cell .im img,.stk .box img{min-width:0;min-height:0}
/* 用户上传的照片：大图完整显示（不裁切），小缩略图才裁成方块 */
.thumb,.cell .im{position:relative}
.pic.photo img,.hero.photo img,.thumb.photo img,.cell .im.photo img{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;filter:none}
.pic.photo img,.hero.photo img{object-fit:contain}
.thumb.photo img,.cell .im.photo img{object-fit:cover}
.hero.photo{height:min(44dvh,340px)}
.hero.cut img,.pic.cut img{max-width:78%;max-height:80%}
#app[data-page=post] #topbar{background:linear-gradient(var(--bg) 72%,rgba(250,247,242,0))}
.report{display:block;margin:18px auto 0;color:var(--ink3);font-size:13px;font-weight:600;padding:8px 12px}
.rules{font-size:12.5px;color:var(--ink2);text-align:center;margin-top:12px;line-height:1.6}
.rules button{text-decoration:underline;text-underline-offset:3px;color:var(--ink);font-weight:600}
.doc h4{font-size:15px;margin:18px 0 6px}.doc p,.doc li{font-size:14px;line-height:1.75;color:var(--ink2)}.doc ul{padding-left:20px}
@media (max-height:640px){.meta{padding:12px 20px 14px}.title{font-size:19px}.btn{height:56px}.actions{height:56px;margin-top:10px}.desc{-webkit-line-clamp:1}}
</style>
</head>
<body>
<div id="app" data-page="swipe">
  <header id="topbar">
    <button class="brand" id="brand"><span class="bz">钱来</span><span class="be">Buy or Bye</span></button>
    <div class="tr">
      <button class="pill" id="btn-wallet"><i class="coin"></i><b id="bal"></b></button>
      <button class="me" id="btn-me" aria-label="settings"><canvas id="me-av" width="16" height="18"></canvas></button>
    </div>
  </header>

  <section class="page" id="pg-swipe">
    <div class="deck" id="deck"></div>
    <div class="actions" id="actions">
      <button class="btn bye" id="btn-bye"><span data-i18n="bye"></span><em>Bye</em></button>
      <button class="btn buy" id="btn-buy"><span data-i18n="buy"></span><em>Buy</em></button>
      <div class="cont">
        <button class="undo" id="btn-undo" data-i18n="undo"></button>
        <button class="nextb" id="btn-next"><span data-i18n="rv_next"></span><i></i></button>
      </div>
    </div>
    <div class="keys" id="keys"></div>
  </section>

  <section class="page" id="pg-post"><div class="post-wrap" id="post"></div></section>

  <section class="page" id="pg-room">
    <canvas id="room-cv" tabindex="-1"></canvas>
    <div class="hud-top">
      <div class="owner" id="owner"></div>
      <div class="hud-btns" id="hud-btns"></div>
    </div>
    <div class="bubble" id="room-hint"></div>
    <button class="tray-btn" id="btn-tray"></button>
  </section>

  <nav id="tabbar">
    <button class="tab" data-go="swipe"><svg viewBox="0 0 24 24"><rect x="7" y="3.5" width="12" height="15" rx="3"/><path d="M5 7.5v10a3 3 0 0 0 3 3h7"/></svg><span data-i18n="tab_browse"></span></button>
    <button class="tab plus" data-go="post" aria-label="list"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-go="room" id="tab-room"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg><span data-i18n="tab_room"></span></button>
  </nav>

  <div id="sheets"></div>
  <div id="fx"></div>
  <div id="toast"></div>
</div>

<script src="lib/three.min.js"></script>
<script src="js/config.js"></script>
<script src="lib/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/art.js"></script>
<script src="js/seed.js"></script>
<script src="js/seed2.js"></script>
<script src="js/gfx.js"></script>
<script src="js/store.js"></script>
<script src="js/cloud.js"></script>
<script src="js/room.js"></script>
<script src="js/app.js"></script>
<script src="js/post.js"></script>
<script src="js/roomui.js"></script>
<script>QL.app.boot();</script>
</body>
</html>
